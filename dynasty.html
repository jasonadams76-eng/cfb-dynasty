function wpick(ws){let r=F()*ws.reduce((a,b)=>a+b,0);for(let i=0;i<ws.length;i++){r-=ws[i];if(r<0)return i}return ws.length-1}

/* starters for a rating group, honoring slot counts (2 OT, 2 OG, 1 C ...); short slots are filled by the best remaining player in the group */
function slotsOrd(list,g,ghostFill){const sl=SLOTS[g],used=new Set(),out=[];
 for(const [k,c] of sl){const a=list.filter(p=>p.pos===k&&!used.has(p)).sort((x,y)=>y.ovr-x.ovr).slice(0,c);a.forEach(x=>used.add(x));for(let i=0;i<c;i++)out.push(a[i]||null)}
 const rest=list.filter(p=>GP(p.pos)===g&&!used.has(p)).sort((x,y)=>y.ovr-x.ovr);
 for(let i=0;i<out.length;i++)if(!out[i])out[i]=rest.length?rest.shift():(ghostFill?ghost(sl[0][0]):null);
 return out}
function slotsPick(list,g,ghostFill){return slotsOrd(list,g,ghostFill).filter(Boolean).sort((x,y)=>y.ovr-x.ovr)}
function slotsPickOld(list,g,ghostFill){const sl=SLOTS[g],n=sl.reduce((a,x)=>a+x[1],0),out=[],used=new Set();
 for(const [k,c] of sl){const a=list.filter(p=>p.pos===k&&!used.has(p)).sort((x,y)=>y.ovr-x.ovr).slice(0,c);a.forEach(x=>used.add(x));out.push(...a)}
 if(out.length<n){const rest=list.filter(p=>GP(p.pos)===g&&!used.has(p)).sort((x,y)=>y.ovr-x.ovr);while(out.length<n&&rest.length)out.push(rest.shift())}
 if(ghostFill)while(out.length<n)out.push(ghost(sl[0][0]));
 return out.sort((x,y)=>y.ovr-x.ovr)}

 for(const p of S.pros){let u=null;for(const f of PUF)if(p[f]!==undefined&&p[f]!==null&&!(Array.isArray(p[f])&&!p[f].length)&&p[f]!==0)(u=u||{})[f]=p[f];if(u)pf[p.id]=u}
 return{from:MP.team0!=null?MP.team0:MP.team,uid:S.uid,slice,pf,team:S.teams[S.uid]}}

async function mpSubmit(force){if(!MP.dyn||MP.host||(mpSubbing&&!force))return;mpSubbing=true;try{
  const o=mpSubObj();MP.team=S.uid;const b64=await gz(JSON.stringify(o,rd)),v=MP.ver,n=await mpPut('sub',v,b64);await mpApi('/api/submit',{json:{v,n,team:S.uid}});MP.msg='';mpSave()
 }catch(e){if(e.status===409)mpPoll();else MP.msg='Could not send changes: '+e.message}finally{mpSubbing=false}}

/* host: put one player's submission into the master state */
function mpMerge(sub){const to=sub.uid,from=sub.from;
 if(from!==to){S.hum=humans().map(h=>h===from?to:h);if(S.users)delete S.users[from];S.pros.forEach(p=>{if(p.U)delete p.U[from]})}
 if(!isH(to))S.hum=humans().concat([to]);
 if(to===S.uid)throw new Error('submission for the host school');
 S.users=S.users||{};S.users[to]=sub.slice;
 for(const p of S.pros){const u=sub.pf[p.id];if(u)(p.U=p.U||{})[to]=u;else if(p.U)delete p.U[to]}
 S.teams[to]=sub.team;UTL=null;UBV++}

/* things that block the stage: unassigned Athletes, rosters over 85, fired coaches without a job */
function mpGates(){const out=[];for(const h of humans()){const t=S.teams[h],sl=slice(h),c=sl&&sl.coach;const nm=(c?c.name:'?')+' ('+t.name+')';
  if(S.stage==='sign'){const n=t.roster.filter(p=>p.ath).length;if(n)out.push({h,k:'ath',txt:nm+' has '+n+' Athlete(s) with no position'})}
  if(S.stage==='cut'&&t.roster.length>85)out.push({h,k:'cut',txt:nm+' is '+(t.roster.length-85)+' over the 85-man limit'});
  if(S.stage==='recap'&&sl.fired&&sl.jobTaken!==S.year)out.push({h,k:'job',txt:nm+' was fired and has not chosen a job'})}return out}
function mpAutoFix(moves){for(const g of mpGates()){const t=S.teams[g.h];noteU(g.h,'The host finished this step for you automatically.');
  if(g.k==='ath')t.roster.filter(p=>p.ath).forEach(p=>autoAssign(t,p));
  else if(g.k==='cut')while(t.roster.length>85){if(!cutOne(t))break}
  else if(g.k==='job')asUser(g.h,()=>{const to=(slice(g.h).jobs||[]).find(x=>!isH(x))??S.teams.find(x=>!isH(x.id)).id;takeJob(to);if(S.uid===to)moves.push([g.h,to])});
}}
async function mpAdvance(force){if(!MP.dyn||!MP.host||MP.busy)return{ok:false,msg:'busy'};MP.busy=true;MP.msg='Collecting everyone\'s changes…';rerenderOnline();
 let began=false;try{
  const b=await mpApi('/api/advance/begin',{json:{}});began=true;
  for(const m of b.members){if(m.host||!m.sub)continue;const sub=JSON.parse(await ungz(await mpGet('sub',b.version,m.sub,'&mid='+m.id)));mpMerge(sub)}
  useUser(MP.team,true);syncUT();
  const moves=[],gates=mpGates();if(gates.length&&!force){await mpApi('/api/advance/abort',{json:{}});MP.busy=false;MP.msg='';return{ok:false,gates}}
  if(gates.length)mpAutoFix(moves);
  const sig=mpSig();advance();
  if(mpSig()===sig){await mpApi('/api/advance/abort',{json:{}});MP.busy=false;MP.msg='The week could not advance (see the message on screen).';return{ok:false,msg:'blocked'}}
  MP.msg='Saving the new week for everyone…';rerenderOnline();
  useUser(MP.team,true);saveNow();await mpPushSnap(b.version+1,mpStatus(),moves);
  MP.busy=false;MP.msg='';return{ok:true,version:b.version+1}
 }catch(e){if(began)try{await mpApi('/api/advance/abort',{json:{}})}catch(x){}MP.busy=false;MP.msg='Advance failed: '+e.message;return{ok:false,msg:e.message}}}
